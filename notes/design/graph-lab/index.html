<title>GreenFN Graph Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@700;900&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one screen. Control strip on top, the map bento fills the rest. Nothing OS: black/white/grey, one red. */
:root{
  --bg:#000;--card:#0B0B0B;--ink:#F2F2F0;--mute:#8C8C88;--faint:#55554F;--line:#232320;--soft:#161614;
  --grid:#1A1A18;--gridmaj:#2A2A27;--red:#FF2D2D;--up:#3DDC84;--same:#8C8C88;--dimdot:.75;
  --display:"Doto","Geist Mono",ui-monospace,monospace;--body:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#FFF;--card:#FFF;--ink:#111;--mute:#6E6E6A;--faint:#B4B4AE;--line:#E3E3DE;--soft:#F4F4F1;--grid:#F0F0EC;--gridmaj:#E0E0DA;--red:#D71921;--up:#0E7A4A;--same:#6E6E6A;--dimdot:.7;color-scheme:light}}
:root[data-theme="light"]{--bg:#FFF;--card:#FFF;--ink:#111;--mute:#6E6E6A;--faint:#B4B4AE;--line:#E3E3DE;--soft:#F4F4F1;--grid:#F0F0EC;--gridmaj:#E0E0DA;--red:#D71921;--up:#0E7A4A;--same:#6E6E6A;--dimdot:.7;color-scheme:light}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:13px;display:flex;flex-direction:column;gap:16px;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
*{box-sizing:border-box}
.lbl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:500}
.lbl b{color:var(--ink);font-weight:600}
header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 28px}
h1{font-family:var(--display);font-weight:900;font-size:26px;letter-spacing:.04em;margin:0;line-height:1}
.group{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select{font-family:var(--body);font-size:12px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
button:hover,select:hover{background:var(--soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.exp{display:inline-flex;align-items:center;gap:8px}
.exp i{font-style:normal;font-family:var(--display);font-weight:900;font-size:14px}
#bento{position:relative;flex:1;min-height:420px;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;touch-action:none;cursor:grab}
#bento.drag{cursor:grabbing}
canvas{position:absolute;inset:0;display:block}
.ov{position:absolute;z-index:2}
.key{left:16px;bottom:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;max-width:calc(100% - 180px)}
.key .sw{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:11.5px}
.key .sw span{white-space:nowrap}.key .sw i{display:inline-block;width:9px;height:9px;margin-right:5px}
.zoom{right:16px;bottom:16px;display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.zoom button{border-radius:8px;width:30px;height:30px;padding:0;background:var(--soft);border:0;font-size:15px}
.zoom span{min-width:52px;text-align:center;font-size:12px;font-variant-numeric:tabular-nums}
.play{right:16px;top:16px;text-align:right}
.count{font-size:11px;color:var(--mute);margin-top:4px;font-variant-numeric:tabular-nums}
.play{left:0;right:0;margin-inline:auto;width:max-content;top:14px;display:flex;align-items:center;gap:12px;white-space:nowrap;background:color-mix(in srgb,var(--card) 90%,transparent);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 10px;backdrop-filter:blur(6px);max-width:calc(100% - 32px);overflow-x:auto}
.play .who{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.play .yr{font-family:var(--display);font-weight:900;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.play .count{font-size:10.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.play .sep{width:1px;height:18px;background:var(--line)}
.play .stat{display:inline-flex;align-items:baseline;gap:6px}
.play .stat .v{font-family:var(--display);font-weight:900;font-size:18px;font-variant-numeric:tabular-nums;min-width:3.2ch;text-align:right}
.play .d{font-size:10.5px;font-weight:600;font-variant-numeric:tabular-nums;min-width:5ch;display:inline-block}
.play .d.up{color:var(--up)}.play .d.down{color:var(--red)}.play .d.same{color:var(--same)}
.play .d.pop{animation:pop .5s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{0%{opacity:0;transform:translateY(6px) scale(.7)}100%{opacity:1;transform:none}}
.play .stat.flash-up .v{animation:fu .7s ease}.play .stat.flash-down .v{animation:fd .7s ease}
@keyframes fu{0%{color:var(--up)}100%{color:var(--ink)}}@keyframes fd{0%{color:var(--red)}100%{color:var(--ink)}}
.play .step{width:26px;height:26px;padding:0;border-radius:50%;font-size:15px;line-height:1}
.play .step:disabled,.play .step:disabled:hover{opacity:.3;cursor:default;background:var(--card)}
@media (prefers-reduced-motion: reduce){.play .d.pop,.play .stat .v{animation:none!important}}
.tip{pointer-events:none;background:var(--ink);color:var(--bg);font-size:11px;padding:4px 8px;border-radius:8px;white-space:nowrap;transform:translate(10px,-28px)}
.hint{left:16px;bottom:96px;font-size:11px;color:var(--mute)}
.loading{inset:0;display:grid;place-items:center;color:var(--mute)}
@media (max-width:640px){.key{max-width:calc(100% - 32px);bottom:64px}}
</style>

<header>
  <h1>GRAPH LAB</h1>
  <div class="group" id="pbctl"><span class="lbl">Career playback</span>
    <div class="row"><select id="who" aria-label="Player"></select><button id="playbtn">▶ Play</button></div>
  </div>
  <div class="group"><span class="lbl">Theme</span>
    <div class="row"><button id="theme">Switch theme</button></div>
  </div>
</header>

<div id="bento" aria-label="Map of every NBA season since 1980. Drag to move, scroll or pinch to zoom.">
  <canvas id="cv"></canvas>
  <div class="ov hint">Drag to move · scroll or pinch to zoom · 0 resets</div>
  <div class="ov play" id="playov" hidden>
    <button class="step" id="prev" aria-label="Previous season">‹</button>
    <span class="who" id="pbname">Michael Jordan</span>
    <span class="yr" id="year">1985</span><span class="count" id="count">01/14</span>
    <span class="sep"></span>
    <span class="stat" data-k="4"><span class="lbl">PTS</span><span class="v">0.0</span><span class="d"></span></span>
    <span class="stat" data-k="6"><span class="lbl">REB</span><span class="v">0.0</span><span class="d"></span></span>
    <span class="stat" data-k="5"><span class="lbl">AST</span><span class="v">0.0</span><span class="d"></span></span>
    <button class="step" id="next" aria-label="Next season">›</button>
  </div>
  <div class="ov key"><div class="lbl"><b>Key</b> · 1 dot = 1 player season</div><div class="sw" id="sw"></div></div>
  <div class="ov zoom"><button id="zout" aria-label="Zoom out">−</button><span id="zval">1.0×</span><button id="zin" aria-label="Zoom in">+</button></div>
  <div class="ov tip" id="tip" hidden></div>
  <div class="ov loading" id="loading">Loading 14,672 seasons…</div>
</div>

<script>
const DEC=["#7b6cf6","#2fa4e7","#22c1a4","#9ad34a","#f5b942"],DLAB=["1980s","1990s","2000s","2010s","2020s"];
const LEGENDS=["jordami01","jamesle01","bryanko01","curryst01","onealsh01","duncati01","johnsma02","birdla01","jokicni01","garneke01","bealbr01","stockjo01"];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=id=>document.getElementById(id);
const bento=$('bento'),cv=$('cv'),ctx=cv.getContext('2d');
$('sw').innerHTML=DLAB.map((l,i)=>`<span><i style="background:${DEC[i]}"></i>${l}</span>`).join('');
let W=0,H=0,dpr=1,S=[],NAMES=[],byPlayer=new Map();
// world: data mapped into a fitted box inside the bento; view: k (zoom), tx, ty (pan, screen px)
let fit={ox:0,oy:0,s:1,x0:0,x1:1,y0:0,y1:1},view={k:1,tx:0,ty:0};
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function resize(){const r=bento.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(2,devicePixelRatio||1);cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';computeFit();clamp();draw();}
function computeFit(){if(!S.length)return;const pad={l:56,r:32,t:64,b:96};const w=W-pad.l-pad.r,h=H-pad.t-pad.b;
  const sx=w/(fit.x1-fit.x0),sy=h/(fit.y1-fit.y0);fit.s=Math.min(sx,sy);fit.ox=pad.l+(w-(fit.x1-fit.x0)*fit.s)/2;fit.oy=pad.t+(h-(fit.y1-fit.y0)*fit.s)/2;}
// grid units: 0..100 across the data's bounding box
const toG=(x,y)=>[(x-fit.x0)/(fit.x1-fit.x0)*100,(y-fit.y0)/(fit.y1-fit.y0)*100];
const baseX=x=>fit.ox+(x-fit.x0)*fit.s, baseY=y=>fit.oy+(fit.y1-y)*fit.s;
const sx=x=>baseX(x)*view.k+view.tx, sy=y=>baseY(y)*view.k+view.ty;
// pan limits: at 1x nothing moves; zoomed in, the 1x frame can never leave the screen
function clamp(){view.k=Math.min(8,Math.max(1,view.k));view.tx=Math.min(0,Math.max(W*(1-view.k),view.tx));view.ty=Math.min(0,Math.max(H*(1-view.k),view.ty));$('zval').textContent=view.k.toFixed(1)+'×';}
function zoomAt(f,px,py){const k2=Math.min(8,Math.max(1,view.k*f));const r=k2/view.k;view.tx=px-(px-view.tx)*r;view.ty=py-(py-view.ty)*r;view.k=k2;clamp();}
function animateView(to,ms=320){if(reduce){Object.assign(view,to);clamp();draw();return;}const from={...view},t0=performance.now();
  const step=t=>{const p=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-p,3);view.k=from.k+(to.k-from.k)*e;view.tx=from.tx+(to.tx-from.tx)*e;view.ty=from.ty+(to.ty-from.ty)*e;clamp();draw();if(p<1)requestAnimationFrame(step);};requestAnimationFrame(step);}
function zoomBtn(f){const k2=Math.min(8,Math.max(1,view.k*f)),r=k2/view.k,cx=W/2,cy=H/2;animateView({k:k2,tx:cx-(cx-view.tx)*r,ty:cy-(cy-view.ty)*r});}
let mouse={x:-1e4,y:-1e4,in:false};
let pb={id:"jordami01",i:-1,timer:null,born:[]};
// ---------- grid ----------
function niceStep(pxPerUnit,minPx){const raw=minPx/pxPerUnit,p=Math.pow(10,Math.floor(Math.log10(raw)));for(const m of [1,2,5,10])if(m*p>=raw)return m*p;return 10*p;}
function drawGrid(){const pxU=fit.s*(fit.x1-fit.x0)/100*view.k; // screen px per grid unit (x); y uses same scale ratio
  const pxUy=fit.s*(fit.y1-fit.y0)/100*view.k;
  const major=niceStep(Math.min(pxU,pxUy),90),minor=major/5;
  const gx=g=>sx(fit.x0+g/100*(fit.x1-fit.x0)),gy=g=>sy(fit.y1-g/100*(fit.y1-fit.y0)); // 0 at the top, 100 at the bottom
  const vis=(a,b)=>[Math.max(0,a),Math.min(100,b)];
  // visible grid range
  const ix=[(0-view.tx)/view.k,(W-view.tx)/view.k].map(px=>((px-fit.ox)/fit.s)+fit.x0).map(x=>(x-fit.x0)/(fit.x1-fit.x0)*100);
  const iy=[(0-view.ty)/view.k,(H-view.ty)/view.k].map(py=>((py-fit.oy)/fit.s)/(fit.y1-fit.y0)*100);
  const [xa,xb]=vis(ix[0],ix[1]),[ya,yb]=vis(iy[0],iy[1]);
  const minorA=Math.max(0,Math.min(1,(minor*Math.min(pxU,pxUy)-6)/18));
  const line=(v,isX,col,a)=>{ctx.globalAlpha=a;ctx.strokeStyle=col;ctx.beginPath();if(isX){const x=Math.round(gx(v))+.5;ctx.moveTo(x,Math.max(0,gy(0)));ctx.lineTo(x,Math.min(H,gy(100)));}else{const y=Math.round(gy(v))+.5;ctx.moveTo(Math.max(0,gx(0)),y);ctx.lineTo(Math.min(W,gx(100)),y);}ctx.stroke();};
  ctx.lineWidth=1;
  if(minorA>0.01){for(let v=Math.ceil(xa/minor)*minor;v<=xb+1e-9;v+=minor)if(Math.abs(v/major-Math.round(v/major))>1e-6)line(v,true,css('--grid'),minorA);
                  for(let v=Math.ceil(ya/minor)*minor;v<=yb+1e-9;v+=minor)if(Math.abs(v/major-Math.round(v/major))>1e-6)line(v,false,css('--grid'),minorA);}
  for(let v=Math.ceil(xa/major)*major;v<=xb+1e-9;v+=major)line(v,true,css('--gridmaj'),1);
  for(let v=Math.ceil(ya/major)*major;v<=yb+1e-9;v+=major)line(v,false,css('--gridmaj'),1);
  ctx.globalAlpha=1;ctx.fillStyle=css('--mute');ctx.font='10px "Geist Mono",monospace';
  const dec=major<1?(major<0.1?2:1):0;
  ctx.textAlign='center';for(let v=Math.ceil(xa/major)*major;v<=xb+1e-9;v+=major){const x=gx(v);if(x>40&&x<W-20)ctx.fillText(v.toFixed(dec),x,Math.max(14,gy(0)-8));}
  ctx.textAlign='right';for(let v=Math.ceil(ya/major)*major;v<=yb+1e-9;v+=major){const y=gy(v);if(y>50&&y<H-70)ctx.fillText(v.toFixed(dec),Math.max(34,gx(0)-8),y+3);}
}
// ---------- draw ----------
function draw(){if(!W)return;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle=css('--card');ctx.fillRect(0,0,W,H);if(!S.length)return;
  drawGrid();
  const size=Math.max(2.2,Math.min(6,2.2*Math.sqrt(view.k)));const half=size/2;const dimA=pb.i>=0?0.18:parseFloat(css('--dimdot'));
  for(let i=0;i<S.length;i++){const s=S[i];let x=sx(s[2]),y=sy(s[3]);
    if(x<-8||x>W+8||y<-8||y>H+8)continue;
    ctx.globalAlpha=dimA;ctx.fillStyle=DEC[s[7]];
    if(view.k>=3){ctx.beginPath();ctx.arc(x,y,half,0,6.283);ctx.fill();}else ctx.fillRect(x-half,y-half,size,size);}
  ctx.globalAlpha=1;
  if(pb.i>=0){const arr=byPlayer.get(pb.id)||[];const now=performance.now();
    for(let j=0;j<=pb.i&&j<arr.length;j++){const s=S[arr[j]];const x=sx(s[2]),y=sy(s[3]);const age=(now-(pb.born[j]||0))/600;
      const pulse=reduce?0:Math.max(0,1-age);ctx.beginPath();ctx.arc(x,y,4+8*pulse,0,6.283);ctx.globalAlpha=pulse*0.35;ctx.fillStyle=css('--red');ctx.fill();
      ctx.globalAlpha=j===pb.i?1:0.75;ctx.beginPath();ctx.arc(x,y,4.2,0,6.283);ctx.fillStyle=css('--card');ctx.fill();ctx.beginPath();ctx.arc(x,y,3.4,0,6.283);ctx.fillStyle=css('--red');ctx.fill();}
    ctx.globalAlpha=1;}
}
// ---------- loop for animated states ----------
let raf=0;function loop(){raf=0;draw();if(pb.i>=0&&!reduce&&performance.now()-(pb.born[pb.i]||0)<700)raf=requestAnimationFrame(loop);}
const kick=()=>{if(!raf)raf=requestAnimationFrame(loop);};
// ---------- input: drag, wheel, pinch, keys ----------
let drag=null,pointers=new Map(),pinch=null;
bento.addEventListener('pointerdown',e=>{if(e.target.closest('.ov button'))return;bento.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){const [a,b]=[...pointers.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)};drag=null;}else drag={x:e.clientX,y:e.clientY,tx:view.tx,ty:view.ty,moved:false};});
bento.addEventListener('pointermove',e=>{const r=bento.getBoundingClientRect();mouse={x:e.clientX-r.left,y:e.clientY-r.top,in:true};
  if(pointers.has(e.pointerId))pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&pointers.size===2){const [a,b]=[...pointers.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);zoomAt(d/pinch.d,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);pinch.d=d;draw();return;}
  if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!drag.moved&&Math.hypot(dx,dy)>4){drag.moved=true;bento.classList.add('drag');}
    if(drag.moved){view.tx=drag.tx+dx;view.ty=drag.ty+dy;clamp();draw();}}
  else hover();});
const endPtr=e=>{pointers.delete(e.pointerId);if(pointers.size<2)pinch=null;if(!pointers.size){drag=null;bento.classList.remove('drag');}};
bento.addEventListener('pointerup',endPtr);bento.addEventListener('pointercancel',endPtr);
bento.addEventListener('pointerleave',()=>{mouse.in=false;$('tip').hidden=true;});
bento.addEventListener('wheel',e=>{e.preventDefault();const r=bento.getBoundingClientRect();const f=Math.exp(-e.deltaY*(e.ctrlKey?0.01:0.0015));zoomAt(f,e.clientX-r.left,e.clientY-r.top);draw();},{passive:false});
bento.addEventListener('dblclick',e=>{const r=bento.getBoundingClientRect();const px=e.clientX-r.left,py=e.clientY-r.top,k2=Math.min(8,view.k*2),q=k2/view.k;animateView({k:k2,tx:px-(px-view.tx)*q,ty:py-(py-view.ty)*q});});
$('zin').onclick=()=>zoomBtn(1.6);$('zout').onclick=()=>zoomBtn(1/1.6);$('zval').ondblclick=()=>animateView({k:1,tx:0,ty:0});
addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='0')animateView({k:1,tx:0,ty:0});if(e.key==='+'||e.key==='=')zoomBtn(1.6);if(e.key==='-')zoomBtn(1/1.6);});
// hover tooltip: nearest season within 8 px
function hover(){if(!S.length||drag)return;let best=-1,bd=64;for(let i=0;i<S.length;i++){const dx=sx(S[i][2])-mouse.x,dy=sy(S[i][3])-mouse.y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=i;}}
  const t=$('tip');if(best<0){t.hidden=true;return;}const s=S[best];t.textContent=`${NAMES[s[0]][1]} · ${s[1]}`;t.style.left=mouse.x+'px';t.style.top=mouse.y+'px';t.hidden=false;}
// ---------- experiment buttons ----------
function tween(el,from,to){if(reduce||from==null){el.textContent=to==null?'-':to.toFixed(1);return;}const t0=performance.now();const f=t=>{const p=Math.min(1,(t-t0)/450),e=1-Math.pow(1-p,3);el.textContent=(from+(to-from)*e).toFixed(1);if(p<1)requestAnimationFrame(f);};requestAnimationFrame(f);}
function renderStats(arr){const cur=S[arr[pb.i]],prev=pb.i>0?S[arr[pb.i-1]]:null;
  document.querySelectorAll('.play .stat').forEach(el=>{const k=+el.dataset.k,v=cur[k],old=el._v;const vEl=el.querySelector('.v'),dEl=el.querySelector('.d');
    tween(vEl,old,v);el._v=v;el.classList.remove('flash-up','flash-down');dEl.className='d';
    if(!prev||v==null||prev[k]==null){dEl.textContent='';return;}
    const diff=Math.round((v-prev[k])*10)/10,cls=diff>0?'up':diff<0?'down':'same';
    dEl.textContent=diff>0?'▲ '+diff.toFixed(1):diff<0?'▼ '+Math.abs(diff).toFixed(1):'= 0.0';
    void dEl.offsetWidth;dEl.classList.add(cls,'pop');if(cls!=='same'){void el.offsetWidth;el.classList.add(cls==='up'?'flash-up':'flash-down');}
    el.setAttribute('aria-label',`${el.querySelector('.lbl').textContent} ${v}, ${cls==='up'?'up':cls==='down'?'down':'no change'} ${Math.abs(diff).toFixed(1)} from last season`);});}
function stepTo(j){const arr=byPlayer.get(pb.id)||[];if(!arr.length)return;stopPlayback(false);pb.i=Math.max(0,Math.min(arr.length-1,j));pb.born[pb.i]=performance.now();showSeason(arr);$('playbtn').textContent=pb.i<arr.length-1?'▶ Play':'↺ Replay';kick();}
$('prev').onclick=()=>stepTo(pb.i-1);$('next').onclick=()=>stepTo(pb.i+1);
function showSeason(arr){const s=S[arr[pb.i]];$('prev').disabled=pb.i<=0;$('next').disabled=pb.i>=arr.length-1;$('year').textContent=s[1];$('count').textContent=String(pb.i+1).padStart(2,'0')+'/'+String(arr.length).padStart(2,'0');renderStats(arr);}
function stopPlayback(clear){clearInterval(pb.timer);pb.timer=null;$('playbtn').textContent='▶ Play';if(clear){pb.i=-1;$('playov').hidden=true;draw();}}
function startPlayback(resume){const arr0=byPlayer.get($('who').value)||[];if(resume&&pb.id===$('who').value&&pb.i>=0&&pb.i<arr0.length-1){$('playbtn').textContent='❚❚ Pause';const t=()=>{pb.i++;pb.born[pb.i]=performance.now();showSeason(arr0);kick();if(pb.i>=arr0.length-1){clearInterval(pb.timer);pb.timer=null;$('playbtn').textContent='↺ Replay';}};pb.timer=setInterval(t,reduce?250:900);return;}
  stopPlayback(false);pb.id=$('who').value;document.querySelectorAll('.play .stat').forEach(el=>el._v=null);const arr=byPlayer.get(pb.id)||[];if(!arr.length)return;pb.i=-1;pb.born=[];$('playov').hidden=false;
  $('pbname').textContent=NAMES[S[arr[0]][0]][1];$('playbtn').textContent='❚❚ Pause';
  // frame the career: zoom so all his seasons fit with room around them
  let a=1e9,b=-1e9,c=1e9,d=-1e9;for(const i of arr){const x=baseX(S[i][2]),y=baseY(S[i][3]);a=Math.min(a,x);b=Math.max(b,x);c=Math.min(c,y);d=Math.max(d,y);}
  const k=Math.min(4,Math.max(1,Math.min(W/((b-a)+260),H/((d-c)+260))));animateView({k,tx:W/2-(a+b)/2*k,ty:H/2-(c+d)/2*k},600);
  const tick=()=>{pb.i++;pb.born[pb.i]=performance.now();showSeason(arr);kick();
    if(pb.i>=arr.length-1){clearInterval(pb.timer);pb.timer=null;$('playbtn').textContent='↺ Replay';}};
  tick();pb.timer=setInterval(tick,reduce?250:900);}
$('playbtn').onclick=()=>{if(pb.timer){stopPlayback(false);$('playbtn').textContent='▶ Play';}else startPlayback(true);};
$('who').onchange=()=>startPlayback();
$('theme').onclick=()=>{const r=document.documentElement;const cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');r.dataset.theme=cur==='dark'?'light':'dark';draw();};
// ---------- data ----------
Promise.all([fetch('seasons.json').then(r=>r.json()),fetch('players.json').then(r=>r.json())]).then(([rows,names])=>{
  NAMES=names;
  S=rows.map(r=>{const dec=Math.min(4,Math.max(0,Math.floor((r[1]-1980)/10)));return [r[0],r[1],r[2],r[3],r[4],r[5],r[6],dec];});
  for(let i=0;i<S.length;i++){const pid=NAMES[S[i][0]][0];if(!byPlayer.has(pid))byPlayer.set(pid,[]);byPlayer.get(pid).push(i);}
  byPlayer.forEach(a=>a.sort((x,y)=>S[x][1]-S[y][1]));
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const s of S){x0=Math.min(x0,s[2]);x1=Math.max(x1,s[2]);y0=Math.min(y0,s[3]);y1=Math.max(y1,s[3]);}
  Object.assign(fit,{x0,x1,y0,y1});
  const opts=LEGENDS.filter(id=>byPlayer.has(id)).map(id=>[id,NAMES[S[byPlayer.get(id)[0]][0]][1]]);
  $('who').innerHTML=opts.map(([id,n])=>`<option value="${id}">${n}</option>`).join('');
  $('loading').remove();resize();startPlayback(false);
}).catch(()=>{$('loading').textContent='Could not load the season data.';});
new ResizeObserver(resize).observe(bento);
</script>
